  <g>
    <rect x="420" y="470" width="340" height="75" rx="12" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
    <circle cx="465" cy="507.5" r="26" fill="#FFFCF0" stroke="#3C2A28" stroke-width="2"/>
    <text x="465" y="507.5" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">10</text>
    <text x="610" y="507.5" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Completion</text>
