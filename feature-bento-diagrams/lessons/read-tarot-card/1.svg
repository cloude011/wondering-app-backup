    <text x="465" y="327.5" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">8</text>
    <text x="610" y="327.5" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Action</text>
  </g>

  <!-- Card 9 -->
  <g>
    <rect x="420" y="380" width="340" height="75" rx="12" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
    <circle cx="465" cy="417.5" r="26" fill="#FFFCF0" stroke="#3C2A28" stroke-width="2"/>
    <text x="465" y="417.5" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">9</text>
    <text x="610" y="417.5" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Fruition</text>
