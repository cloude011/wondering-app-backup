<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
    Tarot Numerology
  </text>
  
  <!-- Column 1 (1-5) -->
  
  <!-- Card 1 -->
  <g>
    <rect x="40" y="110" width="340" height="75" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
    <circle cx="85" cy="147.5" r="26" fill="#FFFCF0" stroke="#3C2A28" stroke-width="2"/>
    <text x="85" y="147.5" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">1</text>
    <text x="230" y="147.5" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">New Start</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="40" y="200" width="340" height="75" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
    <circle cx="85" cy="237.5" r="26" fill="#FFFCF0" stroke="#3C2A28" stroke-width="2"/>
    <text x="85" y="237.5" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">2</text>
