    <text x="230" y="327.5" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Creation</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="40" y="380" width="340" height="75" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
