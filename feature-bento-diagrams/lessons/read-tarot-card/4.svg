<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle">
    The Fool's Journey
  </text>

  <!-- Definitions for Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- STEP 1: The Fool (Top) -->
  <rect x="310" y="100" width="180" height="100" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    1. The Fool
  </text>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="20" fill="#261312" text-anchor="middle" opacity="0.8">
    Innocence
  </text>

  <!-- Arrow 1: Top to Right -->
  <path d="M 490 150 Q 620 150 620 268" stroke="#3C2A28" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- STEP 2: Learning (Right) -->
  <rect x="530" y="280" width="180" height="100" rx="12" fill="#879A39" stroke="#3C2A28" stroke-width="3"/>
  <text x="620" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    2. Learning
  </text>

  <!-- Arrow 2: Right to Bottom -->
  <path d="M 620 380 Q 620 500 502 500" stroke="#3C2A28" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- STEP 3: Challenge (Bottom) -->
  <rect x="310" y="450" width="180" height="100" rx="12" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    3. Challenge
  </text>

  <!-- Arrow 3: Bottom to Left -->
  <path d="M 310 500 Q 180 500 180 392" stroke="#3C2A28" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- STEP 4: The World (Left) -->
  <rect x="90" y="280" width="180" height="100" rx="12" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <text x="180" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    4. The World
  </text>

  <!-- Arrow 4: Left to Top -->
  <path d="M 180 280 Q 180 150 298 150" stroke="#3C2A28" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Center Label -->
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#3C2A28" text-anchor="middle" dy="0.35em" opacity="0.6">
    MAJOR ARCANA
  </text>

</svg>
