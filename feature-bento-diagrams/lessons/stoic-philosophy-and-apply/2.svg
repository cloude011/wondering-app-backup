<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Main Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#261312" text-anchor="middle">
    STOIC CONTROL
  </text>

  <!-- Central Divider Line -->
  <line x1="400" y1="100" x2="400" y2="560" stroke="#3C2A28" stroke-width="4" stroke-dasharray="12,12"/>

  <!-- LEFT COLUMN: WE CONTROL -->
  <!-- Column Header -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle">
    WE CONTROL
  </text>

  <!-- Item 1: Thoughts -->
  <rect x="50" y="160" width="300" height="140" rx="15" fill="#5ABDAC" stroke="#3C2A28" stroke-width="4"/>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="34" fill="#261312" text-anchor="middle" dy="0.35em">
    My Thoughts
  </text>

  <!-- Item 2: Actions -->
  <rect x="50" y="340" width="300" height="140" rx="15" fill="#5ABDAC" stroke="#3C2A28" stroke-width="4"/>
  <text x="200" y="410" font-family="Arial, sans-serif" font-size="34" fill="#261312" text-anchor="middle" dy="0.35em">
    My Actions
  </text>

  <!-- RIGHT COLUMN: NOT CONTROL -->
  <!-- Column Header -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle">
    NO CONTROL
  </text>

  <!-- Item 1: Weather -->
  <rect x="450" y="160" width="300" height="140" rx="15" fill="#7BCAFF" stroke="#3C2A28" stroke-width="4"/>
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="34" fill="#261312" text-anchor="middle" dy="0.35em">
    The Weather
  </text>

  <!-- Item 2: Economy -->
  <rect x="450" y="340" width="300" height="140" rx="15" fill="#7BCAFF" stroke="#3C2A28" stroke-width="4"/>
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="34" fill="#261312" text-anchor="middle" dy="0.35em">
    The Economy
  </text>

  <!-- Visual Cues (Simple Icons/Markers) -->
  <!-- Checkmark for Control -->
  <circle cx="200" cy="530" r="25" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <path d="M190 530 L197 537 L212 522" stroke="#261312" stroke-width="4" fill="none"/>
  
  <!-- X for No Control -->
  <circle cx="600" cy="530" r="25" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  <path d="M592 522 L608 538 M608 522 L592 538" stroke="#261312" stroke-width="4" fill="none"/>

</svg>
