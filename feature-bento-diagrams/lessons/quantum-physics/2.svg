<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Definitions for markers -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Central Divider -->
  <line x1="400" y1="100" x2="400" y2="520" stroke="#3C2A28" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- =========================================
       LEFT SIDE: CLASSICAL (Particle)
       ========================================= -->
  
  <!-- Header -->
  <text x="200" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#261312" text-anchor="middle">
    CLASSICAL
  </text>

  <!-- The "Marble" (Particle) -->
  <circle cx="200" cy="200" r="40" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
  
  <!-- Trajectory Path (Straight) -->
  <line x1="200" y1="250" x2="200" y2="368" 
        stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Target/Landing Spot -->
  <line x1="160" y1="390" x2="240" y2="390" stroke="#3C2A28" stroke-width="3"/>
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="30"
        fill="#261312" text-anchor="middle">
    Particle
  </text>

  <!-- Descriptor Box -->
  <rect x="80" y="480" width="240" height="60" rx="10" fill="#DFB431" stroke="#3C2A28" stroke-width="2"/>
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="28"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Predictable
  </text>


  <!-- =========================================
       RIGHT SIDE: QUANTUM (Wave/Cloud)
       ========================================= -->

  <!-- Header -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#261312" text-anchor="middle">
    QUANTUM
  </text>

  <!-- The "Electron Cloud" (Probability Area) -->
  <circle cx="600" cy="280" r="90" fill="#7BCAFF" fill-opacity="0.3" stroke="#7BCAFF" stroke-width="2" stroke-dasharray="5 5"/>
  
  <!-- The Wave Function -->
  <path d="M 510 280 Q 555 200 600 280 T 690 280" 
        fill="none" stroke="#3C2A28" stroke-width="4"/>

  <!-- Multiple "Possible" Positions (Superposition hint) -->
  <circle cx="555" cy="240" r="8" fill="#3C2A28" fill-opacity="0.6"/>
  <circle cx="600" cy="280" r="8" fill="#3C2A28" fill-opacity="0.6"/>
  <circle cx="645" cy="320" r="8" fill="#3C2A28" fill-opacity="0.6"/>

  <text x="600" y="440" font-family="Arial, sans-serif" font-size="30"
        fill="#261312" text-anchor="middle">
    Wave Function
  </text>

  <!-- Descriptor Box -->
  <rect x="480" y="480" width="240" height="60" rx="10" fill="#5ABDAC" stroke="#3C2A28" stroke-width="2"/>
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="28"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Probabilistic
  </text>

</svg>
