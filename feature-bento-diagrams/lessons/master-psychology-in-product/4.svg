<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Central Title -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#3C2A28" text-anchor="middle">
    The Hook
  </text>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#3C2A28" text-anchor="middle">
    Model
  </text>

  <!-- 1. Trigger (Top) -->
  <rect x="300" y="40" width="200" height="100" rx="15"
        fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    1. Trigger
  </text>

  <!-- 2. Action (Right) -->
  <rect x="560" y="250" width="200" height="100" rx="15"
        fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <text x="660" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    2. Action
  </text>

  <!-- 3. Variable Reward (Bottom) -->
  <rect x="300" y="460" width="200" height="100" rx="15"
        fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="495" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle">
    3. Variable
    <tspan x="400" dy="1.2em">Reward</tspan>
  </text>

  <!-- 4. Investment (Left) -->
  <rect x="40" y="250" width="200" height="100" rx="15"
        fill="#879A39" stroke="#3C2A28" stroke-width="3"/>
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#FFFCF0" text-anchor="middle" dy="0.35em">
    4. Investment
  </text>

  <!-- Connecting Arrows (Clockwise Loop) -->
  
  <!-- Trigger to Action (Top to Right) -->
  <path d="M 500 90 Q 660 90 660 238" fill="none"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
        
  <!-- Action to Reward (Right to Bottom) -->
  <path d="M 660 350 Q 660 510 512 510" fill="none"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
        
  <!-- Reward to Investment (Bottom to Left) -->
  <path d="M 300 510 Q 140 510 140 362" fill="none"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
        
  <!-- Investment to Trigger (Left to Top) -->
  <path d="M 140 250 Q 140 90 288 90" fill="none"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>

</svg>
