<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Main Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle">
    Hick's Law: Psychology in Design
  </text>

  <!-- Vertical Divider -->
  <line x1="400" y1="100" x2="400" y2="550" stroke="#3C2A28" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- LEFT SIDE: CLUTTERED -->
  <!-- Header -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle">
    High Load
  </text>

  <!-- Phone Container -->
  <rect x="70" y="140" width="260" height="360" rx="20" fill="#FFFFFF" stroke="#3C2A28" stroke-width="3"/>

  <!-- Cluttered Buttons (Grid) -->
  <!-- Row 1 -->
  <rect x="90" y="170" width="100" height="50" rx="5" fill="#DFB431" stroke="#3C2A28" stroke-width="2"/>
  <text x="140" y="195" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link A</text>

  <rect x="210" y="170" width="100" height="50" rx="5" fill="#7BCAFF" stroke="#3C2A28" stroke-width="2"/>
  <text x="260" y="195" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link B</text>

  <!-- Row 2 -->
  <rect x="90" y="240" width="100" height="50" rx="5" fill="#7BCAFF" stroke="#3C2A28" stroke-width="2"/>
  <text x="140" y="265" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link C</text>

  <rect x="210" y="240" width="100" height="50" rx="5" fill="#DFB431" stroke="#3C2A28" stroke-width="2"/>
  <text x="260" y="265" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link D</text>

  <!-- Row 3 -->
  <rect x="90" y="310" width="100" height="50" rx="5" fill="#DFB431" stroke="#3C2A28" stroke-width="2"/>
  <text x="140" y="335" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link E</text>

  <rect x="210" y="310" width="100" height="50" rx="5" fill="#7BCAFF" stroke="#3C2A28" stroke-width="2"/>
  <text x="260" y="335" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">Link F</text>

  <!-- Row 4 -->
  <rect x="90" y="380" width="220" height="50" rx="5" fill="#879A39" stroke="#3C2A28" stroke-width="2"/>
  <text x="200" y="405" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="middle" dy="0.35em">More...</text>

  <!-- Result Label Left -->
  <text x="200" y="550" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#3C2A28" text-anchor="middle">
    Slow Decision
  </text>

  <!-- RIGHT SIDE: MINIMALIST -->
  <!-- Header -->
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle">
    Low Load
  </text>

  <!-- Phone Container -->
  <rect x="470" y="140" width="260" height="360" rx="20" fill="#FFFFFF" stroke="#3C2A28" stroke-width="3"/>

  <!-- Hero Image Placeholder -->
  <rect x="500" y="170" width="200" height="140" rx="10" fill="#7BCAFF" stroke="#3C2A28" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Info</text>

  <!-- Primary Action Button -->
  <rect x="500" y="360" width="200" height="80" rx="10" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
    Buy Now
  </text>

  <!-- Result Label Right -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#3C2A28" text-anchor="middle">
    Fast Decision
  </text>

</svg>
