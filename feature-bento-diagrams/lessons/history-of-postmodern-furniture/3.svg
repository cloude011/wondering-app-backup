<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <!-- Definitions for Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Origins of Postmodern Design
  </text>

  <!-- INFLUENCE 1: POP ART (Left) -->
  <rect x="40" y="120" width="220" height="100" rx="15"
        fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Pop Art
  </text>

  <!-- INFLUENCE 2: KITSCH (Center) -->
  <rect x="290" y="120" width="220" height="100" rx="15"
        fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Kitsch
  </text>

  <!-- INFLUENCE 3: ART DECO (Right) -->
  <rect x="540" y="120" width="220" height="100" rx="15"
        fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <text x="650" y="170" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Art Deco
  </text>

  <!-- RESULT NODE: POSTMODERNISM (Bottom) -->
  <rect x="250" y="420" width="300" height="120" rx="15"
        fill="#879A39" stroke="#3C2A28" stroke-width="3"/>
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="30" font-weight="bold"
        fill="#FFFCF0" text-anchor="middle" dy="0.35em">
    Postmodernism
  </text>

  <!-- CONNECTOR 1: Pop Art -> Postmodernism -->
  <line x1="150" y1="220" x2="300" y2="408"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- Label 1 -->
  <text x="180" y="320" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="end">
    Bold Color
  </text>

  <!-- CONNECTOR 2: Kitsch -> Postmodernism -->
  <line x1="400" y1="220" x2="400" y2="408"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- Label 2 -->
  <text x="415" y="320" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="start">
    Irony &amp; Fun
  </text>

  <!-- CONNECTOR 3: Art Deco -> Postmodernism -->
  <line x1="650" y1="220" x2="500" y2="408"
        stroke="#3C2A28" stroke-width="3" marker-end="url(#arrowhead)"/>
  <!-- Label 3 -->
  <text x="620" y="320" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="start">
    Geometry
  </text>

</svg>
