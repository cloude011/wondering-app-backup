<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Title -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle">
    Postmodern Furniture History
  </text>

  <!-- Timeline Axis -->
  <line x1="50" y1="420" x2="738" y2="420" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Event 1: Mid-Century Modern -->
  <!-- Connector -->
  <line x1="160" y1="320" x2="160" y2="420" stroke="#3C2A28" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Node on axis -->
  <circle cx="160" cy="420" r="12" fill="#3C2A28"/>
  <!-- Box -->
  <rect x="60" y="180" width="200" height="140" rx="15" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  <!-- Text -->
  <text x="160" y="235" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Mid-Century</text>
  <text x="160" y="275" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Modern</text>
  <!-- Date Label -->
  <text x="160" y="470" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" font-weight="bold">1950s</text>

  <!-- Event 2: Radical Design -->
  <!-- Connector -->
  <line x1="400" y1="320" x2="400" y2="420" stroke="#3C2A28" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Node on axis -->
  <circle cx="400" cy="420" r="12" fill="#3C2A28"/>
  <!-- Box -->
  <rect x="300" y="180" width="200" height="140" rx="15" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
  <!-- Text -->
  <text x="400" y="235" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Radical</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Design</text>
  <!-- Date Label -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" font-weight="bold">1960s-70s</text>

  <!-- Event 3: Memphis Milano -->
  <!-- Connector -->
  <line x1="640" y1="320" x2="640" y2="420" stroke="#3C2A28" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Node on axis -->
  <circle cx="640" cy="420" r="12" fill="#3C2A28"/>
  <!-- Box -->
  <rect x="540" y="180" width="200" height="140" rx="15" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
  <!-- Text -->
  <text x="640" y="235" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Memphis</text>
  <text x="640" y="275" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">Milano</text>
  <!-- Date Label -->
  <text x="640" y="470" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" font-weight="bold">1981</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>
</svg>
