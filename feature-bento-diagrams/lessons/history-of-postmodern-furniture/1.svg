<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Title -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#261312" text-anchor="middle">
    Postmodern Palette
  </text>
  
  <!-- Title Decoration (Zigzag) -->
  <path d="M250,100 L270,120 L290,100 L310,120 L330,100 L350,120 L370,100 L390,120 L410,100 L430,120 L450,100 L470,120 L490,100 L510,120 L530,100 L550,120" 
        stroke="#7BCAFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- COLUMN 1: BACTERIO PATTERN -->
  <g transform="translate(60, 160)">
    <!-- Container -->
    <rect x="0" y="0" width="200" height="300" rx="12" fill="#DFB431" stroke="#3C2A28" stroke-width="4"/>
    
    <!-- Pattern Elements (Worms) -->
    <g stroke="#3C2A28" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M30,40 Q40,20 50,40"/>
      <path d="M80,30 Q100,50 120,30"/>
      <path d="M150,50 Q160,70 150,90"/>
      <path d="M40,100 Q20,120 40,140"/>
      <path d="M90,110 Q110,90 130,110"/>
      <path d="M160,130 Q180,150 160,170"/>
      <path d="M30,200 Q50,180 70,200"/>
      <path d="M100,180 Q120,200 140,180"/>
      <path d="M170,220 Q150,240 170,260"/>
      <path d="M50,260 Q70,280 90,260"/>
      <path d="M120,250 Q140,230 150,250"/>
    </g>
    
    <!-- Label -->
    <text x="100" y="350" font-family="Arial, sans-serif" font-size="32" fill="#261312" text-anchor="middle" font-weight="bold">
      Bacterio
    </text>
  </g>

  <!-- COLUMN 2: SQUIGGLES -->
  <g transform="translate(300, 160)">
    <!-- Container -->
    <rect x="0" y="0" width="200" height="300" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="4"/>
    
    <!-- Pattern Elements (Waves) -->
    <g stroke="#3C2A28" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20,60 Q40,20 60,60 T100,60 T140,60 T180,60"/>
      <path d="M20,150 Q40,110 60,150 T100,150 T140,150 T180,150"/>
      <path d="M20,240 Q40,200 60,240 T100,240 T140,240 T180,240"/>
    </g>
    
    <!-- Label -->
    <text x="100" y="350" font-family="Arial, sans-serif" font-size="32" fill="#261312" text-anchor="middle" font-weight="bold">
      Squiggles
    </text>
  </g>

  <!-- COLUMN 3: GEOMETRY BLOCKS -->
  <g transform="translate(540, 160)">
    <!-- Background for consistency -->
    <rect x="0" y="0" width="200" height="300" rx="12" fill="#FFFCF0" stroke="#3C2A28" stroke-width="4"/>
    
    <!-- Geometric Totem -->
    <!-- Base -->
    <rect x="40" y="200" width="120" height="70" fill="#5ABDAC" stroke="#3C2A28" stroke-width="4"/>
    <!-- Middle -->
    <circle cx="100" cy="140" r="50" fill="#879A39" stroke="#3C2A28" stroke-width="4"/>
    <!-- Top -->
    <polygon points="40,80 160,80 100,20" fill="#DFB431" stroke="#3C2A28" stroke-width="4"/>
    
    <!-- Label -->
    <text x="100" y="350" font-family="Arial, sans-serif" font-size="32" fill="#261312" text-anchor="middle" font-weight="bold">
      Geometry
    </text>
  </g>

</svg>
