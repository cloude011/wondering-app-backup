<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Main Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#261312" text-anchor="middle">
    KIDS' CHORE GUIDE
  </text>
  
  <!-- Subtitle/Instruction -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="26" fill="#3C2A28" text-anchor="middle">
    Age-Appropriate Responsibilities
  </text>

  <!-- DEFINITIONS -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- COLUMN 1: AGES 3-5 -->
  <g transform="translate(50, 140)">
    <!-- Header -->
    <rect x="0" y="0" width="210" height="70" rx="10" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
    <text x="105" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
      Ages 3-5
    </text>
    
    <!-- Task 1 -->
    <rect x="0" y="90" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#7BCAFF" stroke-width="4"/>
    <text x="105" y="130" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Tidy Toys
    </text>

    <!-- Task 2 -->
    <rect x="0" y="190" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#7BCAFF" stroke-width="4"/>
    <text x="105" y="230" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Feed Pets
    </text>
    
    <!-- Task 3 -->
    <rect x="0" y="290" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#7BCAFF" stroke-width="4"/>
    <text x="105" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Put Clothes Away
    </text>
  </g>

  <!-- COLUMN 2: AGES 6-9 -->
  <g transform="translate(295, 140)">
    <!-- Header -->
    <rect x="0" y="0" width="210" height="70" rx="10" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
    <text x="105" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
      Ages 6-9
    </text>
    
    <!-- Task 1 -->
    <rect x="0" y="90" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#5ABDAC" stroke-width="4"/>
    <text x="105" y="130" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Make Bed
    </text>

    <!-- Task 2 -->
    <rect x="0" y="190" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#5ABDAC" stroke-width="4"/>
    <text x="105" y="230" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Wash Dishes
    </text>
    
    <!-- Task 3 -->
    <rect x="0" y="290" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#5ABDAC" stroke-width="4"/>
    <text x="105" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Vacuum Floor
    </text>
  </g>

  <!-- COLUMN 3: AGES 10-12 -->
  <g transform="translate(540, 140)">
    <!-- Header -->
    <rect x="0" y="0" width="210" height="70" rx="10" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
    <text x="105" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
      Ages 10-12
    </text>
    
    <!-- Task 1 -->
    <rect x="0" y="90" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#DFB431" stroke-width="4"/>
    <text x="105" y="130" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Do Laundry
    </text>

    <!-- Task 2 -->
    <rect x="0" y="190" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#DFB431" stroke-width="4"/>
    <text x="105" y="230" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Cook Meals
    </text>
    
    <!-- Task 3 -->
    <rect x="0" y="290" width="210" height="80" rx="8" fill="#FFFCF0" stroke="#DFB431" stroke-width="4"/>
    <text x="105" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
      Wash Car
    </text>
  </g>

  <!-- Bottom Arrow Indicator -->
  <line x1="155" y1="550" x2="633" y2="550" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#3C2A28" text-anchor="middle">
    Increasing Independence
  </text>

</svg>
