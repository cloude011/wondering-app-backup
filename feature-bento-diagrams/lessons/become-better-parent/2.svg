<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Main Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#261312" text-anchor="middle">Parenting Styles</text>

  <!-- Center Divider -->
  <line x1="400" y1="100" x2="400" y2="550" stroke="#3C2A28" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- LEFT SIDE: PUNISHMENT -->
  <g>
    <!-- Header -->
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#261312" text-anchor="middle">Punishment</text>
    
    <!-- Concept Shape -->
    <circle cx="200" cy="230" r="70" fill="#DFB431" stroke="#3C2A28" stroke-width="3"/>
    <text x="200" y="230" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Shame</text>

    <!-- Connector -->
    <line x1="200" y1="320" x2="200" y2="398" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="180" y="360" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="end" dy="0.35em">Forces</text>

    <!-- Result Shape -->
    <rect x="80" y="420" width="240" height="100" rx="12" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
    <text x="200" y="470" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Fear</text>
  </g>

  <!-- RIGHT SIDE: DISCIPLINE -->
  <g>
    <!-- Header -->
    <text x="600" y="130" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#261312" text-anchor="middle">Discipline</text>

    <!-- Concept Shape -->
    <circle cx="600" cy="230" r="70" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3"/>
    <text x="600" y="230" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Teach</text>

    <!-- Connector -->
    <line x1="600" y1="320" x2="600" y2="398" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="620" y="360" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="start" dy="0.35em">Guides</text>

    <!-- Result Shape -->
    <rect x="480" y="420" width="240" height="100" rx="12" fill="#879A39" stroke="#3C2A28" stroke-width="3"/>
    <text x="600" y="470" font-family="Arial, sans-serif" font-size="30" fill="#261312" text-anchor="middle" dy="0.35em">Growth</text>
  </g>
</svg>
