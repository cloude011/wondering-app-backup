<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 1. Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <!-- 2. Divider Line -->
  <line x1="400" y1="100" x2="400" y2="560" stroke="#3C2A28" stroke-width="4" stroke-dasharray="12,12"/>

  <!-- 3. Headers -->
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
    LEGIONARY
  </text>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle" dy="0.35em">
    TRIBAL
  </text>

  <!-- =========================================
       LEFT SIDE: ROMAN
       ========================================= -->

  <!-- Roman Shield (Scutum) -->
  <!-- Rectangular, curved, semi-cylindrical representation -->
  <rect x="110" y="120" width="180" height="220" rx="15" fill="#DFB431" stroke="#3C2A28" stroke-width="4"/>
  <!-- Shield Boss (Umbo) -->
  <circle cx="200" cy="230" r="20" fill="#FFFCF0" stroke="#3C2A28" stroke-width="3"/>
  <!-- Decorative wings/lines typical of Scutum -->
  <path d="M 200 120 L 200 150 M 200 310 L 200 340 M 110 230 L 140 230 M 260 230 L 290 230" stroke="#3C2A28" stroke-width="3"/>
  
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    SCUTUM
  </text>

  <!-- Roman Weapon (Gladius) -->
  <!-- Short, stabbing sword -->
  <g transform="translate(0, 50)">
    <!-- Handle -->
    <rect x="190" y="380" width="20" height="40" rx="5" fill="#3C2A28"/>
    <!-- Guard -->
    <rect x="175" y="420" width="50" height="10" rx="2" fill="#DFB431" stroke="#3C2A28" stroke-width="2"/>
    <!-- Blade (Short) -->
    <path d="M 180 430 L 220 430 L 200 520 Z" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  </g>

  <text x="200" y="540" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    GLADIUS
  </text>

  <!-- =========================================
       RIGHT SIDE: BARBARIAN
       ========================================= -->

  <!-- Barbarian Shield -->
  <!-- Round/Oval -->
  <circle cx="600" cy="230" r="100" fill="#5ABDAC" stroke="#3C2A28" stroke-width="4"/>
  <!-- Shield Boss -->
  <circle cx="600" cy="230" r="20" fill="#FFFCF0" stroke="#3C2A28" stroke-width="3"/>
  <!-- Wood grain / Plank effect -->
  <line x1="600" y1="130" x2="600" y2="210" stroke="#3C2A28" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="250" x2="600" y2="330" stroke="#3C2A28" stroke-width="2" opacity="0.5"/>
  
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    ROUND SHIELD
  </text>

  <!-- Barbarian Weapon (Long Sword/Spatha) -->
  <!-- Longer, slashing sword -->
  <g transform="translate(0, 50)">
    <!-- Handle -->
    <rect x="590" y="360" width="20" height="50" rx="5" fill="#3C2A28"/>
    <!-- Guard -->
    <rect x="570" y="410" width="60" height="10" rx="2" fill="#5ABDAC" stroke="#3C2A28" stroke-width="2"/>
    <!-- Blade (Long) -->
    <path d="M 580 420 L 620 420 L 615 540 L 600 550 L 585 540 Z" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3"/>
  </g>

  <text x="600" y="540" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    LONG SWORD
  </text>

</svg>
