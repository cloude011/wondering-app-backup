<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFFCF0"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#261312" text-anchor="middle">
    Neural Network Training Loop
  </text>

  <!-- Step 1: Forward Pass (Top) -->
  <rect x="275" y="100" width="250" height="100" fill="#7BCAFF" stroke="#3C2A28" stroke-width="3" rx="10"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    Forward Pass
  </text>

  <!-- Step 2: Loss (Right) -->
  <rect x="520" y="280" width="220" height="100" fill="#DFB431" stroke="#3C2A28" stroke-width="3" rx="10"/>
  <text x="630" y="330" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    Loss Score
  </text>

  <!-- Step 3: Backprop (Bottom) -->
  <rect x="275" y="460" width="250" height="100" fill="#5ABDAC" stroke="#3C2A28" stroke-width="3" rx="10"/>
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="28" fill="#261312" text-anchor="middle" dy="0.35em">
    Backprop
  </text>

  <!-- Step 4: Update (Left) -->
  <rect x="60" y="280" width="220" height="100" fill="#879A39" stroke="#3C2A28" stroke-width="3" rx="10"/>
  <text x="170" y="330" font-family="Arial, sans-serif" font-size="28" fill="#FFFCF0" text-anchor="middle" dy="0.35em">
    Update Weights
  </text>

  <!-- Connecting Arrows -->
  <!-- Forward to Loss -->
  <path d="M 525 150 Q 630 150 630 265" fill="none" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="650" y="210" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="start">Predict</text>

  <!-- Loss to Backprop -->
  <path d="M 630 380 Q 630 510 540 510" fill="none" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="640" y="450" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="start">Compare</text>

  <!-- Backprop to Update -->
  <path d="M 275 510 Q 170 510 170 395" fill="none" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="start">Calculate</text>

  <!-- Update to Forward -->
  <path d="M 170 280 Q 170 150 260 150" fill="none" stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="60" y="210" font-family="Arial, sans-serif" font-size="26" fill="#261312" text-anchor="start">Improve</text>

</svg>
