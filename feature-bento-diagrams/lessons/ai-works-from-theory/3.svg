<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#FFFCF0"/>

  <!-- Definitions for Arrowhead -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10"
            markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#3C2A28"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#261312" text-anchor="middle">
    AI Data Pipeline
  </text>

  <!-- Step 1: Raw Data -->
  <rect x="250" y="80" width="300" height="90" rx="15"
        fill="#7BCAFF" stroke="#3C2A28" stroke-width="4"/>
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="30"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Raw Data
  </text>

  <!-- Arrow 1 -->
  <line x1="400" y1="170" x2="400" y2="208"
        stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="425" y="195" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="start" dy="0.35em">
    Clean
  </text>

  <!-- Step 2: Feature Extraction -->
  <rect x="250" y="220" width="300" height="90" rx="15"
        fill="#5ABDAC" stroke="#3C2A28" stroke-width="4"/>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="30"
        fill="#261312" text-anchor="middle" dy="0.35em">
    Features
  </text>

  <!-- Arrow 2 -->
  <line x1="400" y1="310" x2="400" y2="348"
        stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="425" y="335" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="start" dy="0.35em">
    Train
  </text>

  <!-- Step 3: AI Model -->
  <rect x="250" y="360" width="300" height="90" rx="15"
        fill="#DFB431" stroke="#3C2A28" stroke-width="4"/>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="30"
        fill="#261312" text-anchor="middle" dy="0.35em">
    AI Model
  </text>

  <!-- Arrow 3 -->
  <line x1="400" y1="450" x2="400" y2="488"
        stroke="#3C2A28" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="425" y="475" font-family="Arial, sans-serif" font-size="26"
        fill="#261312" text-anchor="start" dy="0.35em">
    Predict
  </text>

  <!-- Step 4: Application -->
  <rect x="250" y="500" width="300" height="90" rx="15"
        fill="#879A39" stroke="#3C2A28" stroke-width="4"/>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="30"
        fill="#FFFCF0" text-anchor="middle" dy="0.35em">
    Application
  </text>

</svg>
